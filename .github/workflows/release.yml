name: CI and release

on:
  # Branches get CI through their pull request; pushing on every branch as well would run it twice.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -m "not gui and not slow"

  build-windows:
    name: Build Windows (exe, zip, installer)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Read version
        id: ver
        run: |
          $v = python packaging/make_version_info.py --print-version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build one-dir app
        run: python -m PyInstaller packaging/nightvision.spec --noconfirm --clean --workpath build/pyi --distpath dist
      - name: Smoke test
        run: |
          foreach ($exe in 'NightVision.exe', 'NightVisionCLI.exe') {
            if (-not (Test-Path "dist\NightVision\$exe")) { throw "$exe missing from dist\NightVision" }
          }
          dist\NightVision\NightVisionCLI.exe --help
          if ($LASTEXITCODE -ne 0) { throw "NightVisionCLI.exe --help failed ($LASTEXITCODE)" }
          dist\NightVision\NightVisionCLI.exe --list-presets
          if ($LASTEXITCODE -ne 0) { throw "NightVisionCLI.exe --list-presets failed ($LASTEXITCODE)" }
          # Exercise the frozen app's real startup (backend probing, control socket, clean exit),
          # which --help and --list-presets never reach.
          dist\NightVision\NightVisionCLI.exe --list-backends
          if ($LASTEXITCODE -ne 0) { throw "NightVisionCLI.exe --list-backends failed ($LASTEXITCODE)" }
          dist\NightVision\NightVisionCLI.exe --headless --dry-run --max-seconds 3
          if ($LASTEXITCODE -ne 0) { throw "NightVisionCLI.exe headless run failed ($LASTEXITCODE)" }
      - name: Compile installer
        env:
          NV_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Inno Setup 6 is preinstalled on windows-latest; fall back to Chocolatey if it is not.
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed ($LASTEXITCODE)" }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$env:NV_VERSION" packaging\nightvision.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
      - name: Package zip and checksums
        env:
          NV_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist\NightVision -DestinationPath "release\NightVision-$env:NV_VERSION-windows-x64.zip"
          Copy-Item "dist\installer\NightVision-$env:NV_VERSION-windows-x64-setup.exe" release\
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          python packaging/checksums.py -o release/SHA256SUMS-windows-x64.txt @files
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (tarball)
    needs: test
    # Older runner image on purpose: the bundle needs at least the glibc of the machine that built it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 tk
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build tarball
        run: packaging/build_linux.sh
      - name: Smoke test
        run: |
          mkdir smoke
          tar -xzf dist/linux/NightVision-*-linux-x86_64.tar.gz -C smoke
          smoke/NightVision-*/NightVision/NightVision --help
          smoke/NightVision-*/NightVision/NightVision --list-presets
          # Real startup without a display: the control socket needs a private runtime directory.
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          smoke/NightVision-*/NightVision/NightVision --list-backends
          smoke/NightVision-*/NightVision/NightVision --headless --dry-run --max-seconds 3
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/linux/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python packaging/make_version_info.py --print-version)"
          project="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ] || [ "$TAG" != "v$project" ]; then
            echo "tag $TAG does not match package version $version / pyproject version $project" >&2
            exit 1
          fi
      - name: Combined checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS-*.txt
          python ../packaging/checksums.py -o SHA256SUMS.txt NightVision-*
          sha256sum -c SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
